[package]
name = "simple-vnc-viewer"
version = "0.1.0"
edition = "2021"
default-run = "simple-vnc-viewer"

[[bin]]
name = "simple-vnc-viewer"
path = "src/main.rs"

[[bin]]
name = "simple-vnc-server"
path = "src/server.rs"

[dependencies]
eframe = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
opt-level = 3
